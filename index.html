<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Five Star Coffee · Menú</title>
<style>
:root{--bg:#f6efe6;--card:#ffffff;--tx:#231815;--mu:#6f625a;--ac:#c4161c;--ac2:#9f1015;--bd:#e5d9cc;--navy:#1f2a44;--rd:#c4161c;--gold:#d97706}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:860px;margin:0 auto;padding:0 20px 64px}

/* Top & Logo */
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0}
.logo{height:64px;width:auto;display:block;cursor:pointer;user-select:none;transition:transform .15s ease}
.logo:active{transform:scale(.96)}

/* Hero */
.hero{background:linear-gradient(135deg,var(--ac) 0%,var(--ac2) 100%);color:#fff;border-radius:18px;padding:36px 26px 32px;margin-bottom:22px;position:relative;overflow:hidden;box-shadow:0 8px 24px rgba(196,22,28,.16)}
.hero:after{content:"★ ★ ★ ★ ★";position:absolute;right:22px;bottom:14px;color:rgba(255,255,255,.32);letter-spacing:.3em;font-size:13px}
.eyebrow{font-size:13px;text-transform:uppercase;letter-spacing:.08em;opacity:.88;font-weight:600}
h1{font:600 clamp(34px,7vw,54px)/1.05 Georgia,serif;margin:8px 0 10px}
.hero p{margin:0;max-width:48ch;opacity:.93;font-size:15px}

/* Buscador */
.search-box{position:relative;margin-bottom:14px}
.search-box input{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:11px 38px 11px 38px;font-size:15px;color:var(--tx);box-shadow:0 2px 8px rgba(35,24,21,.04)}
.search-box input::placeholder{color:var(--mu)}
.search-ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--mu);pointer-events:none;font-size:15px}
.clear-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:var(--bg);border:none;color:var(--mu);border-radius:99px;width:24px;height:24px;padding:0;font-size:13px;display:flex;align-items:center;justify-content:center}

/* Navegación fija de categorías */
#cats{position:sticky;top:0;z-index:20;display:flex;gap:8px;overflow-x:auto;padding:10px 20px;margin:0 -20px 16px;background:rgba(246,239,230,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--bd);scrollbar-width:none}
#cats::-webkit-scrollbar{display:none}
#cats button{flex:0 0 auto;border-radius:99px;background:var(--card);border:1px solid var(--bd);color:var(--navy);padding:6px 15px;font-size:14px;font-weight:500;white-space:nowrap;transition:all .15s ease}
#cats button.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(196,22,28,.22)}

/* Destacados / Favoritos de la casa */
.featured-sec{margin-bottom:28px}
.sec-label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);font-weight:700;margin:0 0 10px;display:flex;align-items:center;gap:6px}
.featured-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.feat-card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;box-shadow:0 2px 8px rgba(35,24,21,.03)}
.feat-badge{display:inline-block;align-self:flex-start;font-size:11px;font-weight:700;color:var(--gold);background:#fef3c7;border-radius:99px;padding:2px 8px}
.feat-card h3{margin:0;font-size:16px;color:var(--navy)}
.feat-card p{margin:2px 0 0;font-size:13px;color:var(--mu)}
.feat-foot{display:flex;justify-content:space-between;align-items:center;margin-top:4px;padding-top:8px;border-top:1px dashed var(--bd)}
.feat-cat{font-size:11px;color:var(--mu)}

/* Secciones y platillos */
h2{font:600 23px Georgia,serif;color:var(--ac);margin:32px 0 10px;padding-bottom:8px;border-bottom:2px solid var(--ac);scroll-margin-top:64px}
.item{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:14px 4px;border-bottom:1px dashed var(--bd)}
.item h3{margin:0;font-size:16.5px;color:var(--navy);line-height:1.3}
.item p{margin:3px 0 0;color:var(--mu);font-size:14px}
.price{color:var(--ac);font-weight:700;white-space:nowrap;font-size:16px}
.off{opacity:.48}.tag{font-size:11px;color:var(--rd);border:1px solid var(--rd);border-radius:99px;padding:1px 8px;margin-left:8px;vertical-align:middle}
.empty{color:var(--mu);text-align:center;padding:28px 16px;background:var(--card);border:1px dashed var(--bd);border-radius:12px;margin-top:12px}

/* Skeleton de carga */
.skel-wrap{display:grid;gap:12px;padding:12px 0}
.skel{height:58px;border-radius:10px;background:linear-gradient(90deg,#ece2d5 25%,#f9f4ee 50%,#ece2d5 75%);background-size:200% 100%;animation:shimmer 1.3s infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* Admin bar & forms */
.bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;background:var(--navy);color:#fff;border-radius:12px;padding:12px 16px;margin-bottom:20px}
.bar-btns{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 14px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
button.pri:hover{background:var(--ac2)}
button.del{color:var(--rd);border-color:var(--rd)}
.acts{display:flex;gap:6px;margin-top:8px}.acts button{padding:4px 10px;font-size:13px}
form{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;display:grid;gap:12px;margin-bottom:24px;box-shadow:0 4px 16px rgba(35,24,21,.06)}
form h3{margin:0;font-size:17px;color:var(--navy)}
[hidden]{display:none!important}
input,select,textarea{font:inherit;width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:9px 11px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.row{grid-template-columns:1fr}}
label{font-size:13px;color:var(--mu);display:grid;gap:4px}
label.ck{display:flex;align-items:center;gap:8px;color:var(--tx);align-self:end;padding-bottom:8px}label.ck input{width:auto}
#err{color:var(--rd);font-size:14px}

/* Footer comercial */
footer{margin-top:44px;padding-top:24px;border-top:1px solid var(--bd);color:var(--mu);font-size:13.5px}
.info-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
@media (max-width:560px){.info-cards{grid-template-columns:1fr}}
.info-card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.info-card strong{display:block;color:var(--navy);font-size:13.5px}
.info-card span{font-size:12
